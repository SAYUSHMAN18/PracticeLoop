databases:
  - name: practiceloop-db
    databaseName: practiceloop
    user: practiceloop
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: practiceloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: practiceloop-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # set this in the Render dashboard after the blueprint deploys -- never commit a real key
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Signup is open, so the per-user LLM_DAILY_BUDGET alone leaves total spend
      # against the shared GROQ_API_KEY unbounded. This is the ceiling for the
      # whole deployment per day; raise it if real usage justifies the cost.
      - key: LLM_GLOBAL_DAILY_BUDGET
        value: "500"
      - key: SENTRY_DSN
        sync: false # optional -- unset disables error reporting; needs the `sentry` extra
      - key: JOBS_CRON_TOKEN
        sync: false # must match the JOBS_CRON_TOKEN secret in this repo's GitHub Actions settings
      - key: ADZUNA_APP_ID
        sync: false # optional -- discovery runs and records a job_runs row either way, just
      - key: ADZUNA_APP_KEY
        sync: false # finds nothing without these (free at developer.adzuna.com)
      # --- Transactional email (password reset, verification, re-engagement digest) ---
      # Without a real backend the app logs emails to stdout instead of sending
      # them (EMAIL_BACKEND=console), so password reset / verify links never
      # reach users. Render blocks outbound SMTP, so the backend must be an API
      # one: `brevo` (300/day free, only needs a verified sender address) or
      # `resend` (best deliverability, but needs a verified domain).
      - key: EMAIL_BACKEND
        value: brevo # console | brevo | resend | smtp
      - key: BREVO_API_KEY
        sync: false # brevo.com -> SMTP & API -> API keys (xkeysib-...); required for EMAIL_BACKEND=brevo
      - key: RESEND_API_KEY
        sync: false # resend.com/api-keys; required for EMAIL_BACKEND=resend (also needs a verified domain)
      - key: EMAIL_FROM
        sync: false # e.g. "PracticeLoop <noreply@yourdomain.com>". For brevo this must be a
                    # verified Sender in the Brevo dashboard; for resend, on a verified domain.
      - key: DIGEST_CRON_TOKEN
        sync: false # must match the DIGEST_CRON_TOKEN secret in this repo's GitHub Actions
                    # settings; the digest.yml workflow POSTs /cron/digest with it. Unset =>
                    # /cron/digest fail-closes with 503 and no digests go out.
      - key: ADMIN_EMAILS
        sync: false # optional -- comma-separated allow-list for the /admin dashboard
