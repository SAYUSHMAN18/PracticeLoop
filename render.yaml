databases:
  - name: practiceloop-db
    databaseName: practiceloop
    user: practiceloop
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: practiceloop
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: practiceloop-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false # set this in the Render dashboard after the blueprint deploys -- never commit a real key
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
