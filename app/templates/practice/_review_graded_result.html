<div class="card" hx-get="/practice/review/next" hx-trigger="load delay:3000ms" hx-target="#review-card" hx-swap="innerHTML">
  <p class="{{ 'success' if rating >= 4 else 'error' if rating <= 2 else 'muted' }}" style="margin:0;">
    Graded {{ rating }}/5
  </p>
  {% if feedback %}<div class="markdown-body" style="margin-top:0.5rem;">{{ feedback }}</div>{% endif %}
  <p class="muted" style="margin-top:0.5rem;">Correct answer: {{ correct_answer }}</p>
  <p class="success" style="margin-top:0.5rem;">
    Next review in {{ days_until }} day{{ "s" if days_until != 1 }} ({{ review_date.strftime("%b %d, %Y") }})
  </p>
</div>
