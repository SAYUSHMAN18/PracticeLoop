{% extends "base.html" %}
{% block title %}Review - PracticeLoop{% endblock %}
{% block content %}
<h1>Review queue</h1>
<p class="muted">
  Current streak: <strong>{{ streak }}</strong> day{{ "s" if streak != 1 }}
  &middot; <a href="/practice/history">Study history</a>
</p>

<div id="review-card" aria-live="polite" aria-atomic="true">
  {% include "practice/_review_card.html" %}
</div>

<script>
document.body.addEventListener('keydown', function (e) {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    const details = document.querySelector('#review-card details');
    if (details) { details.open = !details.open; e.preventDefault(); }
    return;
  }
  const btn = document.querySelector('#review-card .rating-btn[data-key="' + e.key + '"]');
  if (btn) btn.click();
});
</script>
{% endblock %}
