<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PracticeLoop{% endblock %}</title>
  <script>
    // Applied before first paint (this is a synchronous, render-blocking
    // script in <head>) so a saved manual theme choice never flashes the
    // wrong palette on load. Absence of a saved value leaves data-theme
    // unset, which is the "follow system" default handled entirely by
    // style.css's prefers-color-scheme block.
    (function () {
      try {
        var saved = localStorage.getItem("pl-theme");
        if (saved === "light" || saved === "dark" || saved === "contrast") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ asset_version }}">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  {% set cu = request.state.current_user %}
  <div class="app-shell">
    <button class="sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
      <span></span><span></span><span></span>
    </button>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/dashboard">PracticeLoop</a>

      <button type="button" class="command-palette-trigger" id="command-palette-trigger" aria-label="Open command palette">
        <span>Go to&hellip;</span>
        <kbd id="command-palette-shortcut-hint">Ctrl K</kbd>
      </button>

      {% if cu %}
      <div class="sidebar-user">
        <div class="sidebar-avatar" aria-hidden="true">{{ cu.name[0]|upper }}</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name">{{ cu.name }}</div>
          <div class="sidebar-user-email">{{ cu.email }}</div>
        </div>
      </div>
      {% endif %}

      <nav class="sidebar-nav" aria-label="Main">
        <a href="/dashboard" class="{{ 'active' if request.url.path == '/dashboard' }}">Dashboard</a>
        <a href="/practice" class="{{ 'active' if request.url.path == '/practice' }}">Practice</a>
        <a href="/practice/review" class="{{ 'active' if request.url.path.startswith('/practice/review') }}">Review</a>
        <a href="/jobs" class="{{ 'active' if request.url.path.startswith('/jobs') }}">Jobs</a>
        <a href="/documents" class="{{ 'active' if request.url.path == '/documents' }}">Documents</a>
        <a href="/profile" class="{{ 'active' if request.url.path == '/profile' }}">Profile</a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="link-button" id="theme-toggle" aria-label="Change color theme">
          Theme: <span id="theme-toggle-label">System</span>
        </button>
        <form action="/logout" method="post">
          <button type="submit" class="link-button">Log out</button>
        </form>
      </div>
    </aside>

    <main class="app-main" id="main-content" tabindex="-1">
      <div class="container">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  <div class="command-palette-backdrop" id="command-palette-backdrop" hidden>
    <div class="command-palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <input type="text" id="command-palette-input" placeholder="Go to a page or run an action&hellip;" autocomplete="off" aria-label="Search pages and actions">
      <ul id="command-palette-results" role="listbox"></ul>
    </div>
  </div>

  <script>
    // Command palette (Phase 1.4): a static, client-side list of every
    // page and quick action this app has -- no full-text search backend
    // needed since the whole point is fast keyboard navigation between a
    // known, small set of destinations, not searching content.
    (function () {
      var COMMANDS = [
        { label: "Dashboard", href: "/dashboard", keywords: "home today" },
        { label: "Practice question bank", href: "/practice", keywords: "capture questions bank" },
        { label: "Review queue", href: "/practice/review", keywords: "study review spaced repetition" },
        { label: "Job listings", href: "/jobs", keywords: "jobs discovery" },
        { label: "Application tracker", href: "/jobs/applications", keywords: "jobs applications kanban" },
        { label: "Skill gap analysis", href: "/jobs/gap-analysis", keywords: "jobs gaps jd" },
        { label: "Tailor resume to a JD", href: "/jobs/tailor-resume", keywords: "jobs resume tailor jd" },
        { label: "Market trends", href: "/jobs/trends", keywords: "jobs trends demand" },
        { label: "Discovery runs", href: "/jobs/runs", keywords: "jobs cron runs" },
        { label: "Document vault", href: "/documents", keywords: "resume transcripts certificates upload" },
        { label: "Profile & settings", href: "/profile", keywords: "settings goal timezone proficiency" },
        { label: "Log out", href: "/logout", keywords: "sign out", isForm: true },
      ];

      var trigger = document.getElementById("command-palette-trigger");
      var backdrop = document.getElementById("command-palette-backdrop");
      var input = document.getElementById("command-palette-input");
      var resultsList = document.getElementById("command-palette-results");
      var shortcutHint = document.getElementById("command-palette-shortcut-hint");
      if (!trigger || !backdrop || !input || !resultsList) return;

      if (navigator.platform && navigator.platform.toUpperCase().indexOf("MAC") >= 0) {
        shortcutHint.textContent = "⌘K";
      }

      var activeIndex = 0;
      var visible = [];

      function render(query) {
        var q = query.trim().toLowerCase();
        visible = COMMANDS.filter(function (c) {
          return !q || c.label.toLowerCase().indexOf(q) !== -1 || c.keywords.indexOf(q) !== -1;
        });
        activeIndex = 0;
        resultsList.innerHTML = "";
        visible.forEach(function (c, i) {
          var li = document.createElement("li");
          li.textContent = c.label;
          li.setAttribute("role", "option");
          li.className = i === activeIndex ? "active" : "";
          li.addEventListener("mouseenter", function () { setActive(i); });
          li.addEventListener("click", function () { activate(c); });
          resultsList.appendChild(li);
        });
      }

      function setActive(i) {
        activeIndex = i;
        Array.from(resultsList.children).forEach(function (li, idx) {
          li.className = idx === activeIndex ? "active" : "";
        });
      }

      function activate(command) {
        if (!command) return;
        if (command.isForm) {
          var form = document.createElement("form");
          form.method = "post";
          form.action = command.href;
          document.body.appendChild(form);
          form.submit();
        } else {
          window.location.href = command.href;
        }
      }

      function open() {
        backdrop.hidden = false;
        input.value = "";
        render("");
        input.focus();
      }

      function close() {
        backdrop.hidden = true;
      }

      trigger.addEventListener("click", open);
      backdrop.addEventListener("click", function (e) {
        if (e.target === backdrop) close();
      });
      input.addEventListener("input", function () { render(input.value); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          setActive(Math.min(activeIndex + 1, visible.length - 1));
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          setActive(Math.max(activeIndex - 1, 0));
        } else if (e.key === "Enter") {
          e.preventDefault();
          activate(visible[activeIndex]);
        } else if (e.key === "Escape") {
          close();
        }
      });

      document.addEventListener("keydown", function (e) {
        var isShortcut = (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k";
        if (isShortcut) {
          e.preventDefault();
          if (backdrop.hidden) open(); else close();
        } else if (e.key === "Escape" && !backdrop.hidden) {
          close();
        }
      });
    })();
  </script>

  <script>
    // Mobile sidebar drawer: hidden off-canvas by default (see the
    // max-width: 860px rules in style.css), toggled by the hamburger
    // button, dismissed by the backdrop or by following a nav link.
    (function () {
      var toggle = document.getElementById("sidebar-toggle");
      var sidebar = document.getElementById("sidebar");
      var backdrop = document.getElementById("sidebar-backdrop");
      if (!toggle || !sidebar || !backdrop) return;

      function setOpen(open) {
        sidebar.classList.toggle("open", open);
        backdrop.classList.toggle("open", open);
        toggle.setAttribute("aria-expanded", open ? "true" : "false");
      }

      toggle.addEventListener("click", function () {
        setOpen(!sidebar.classList.contains("open"));
      });
      backdrop.addEventListener("click", function () { setOpen(false); });
      sidebar.querySelectorAll("a").forEach(function (a) {
        a.addEventListener("click", function () { setOpen(false); });
      });
    })();

    // Four-way theme cycle: system -> light -> dark -> contrast -> system.
    // "System" means no saved preference at all, so the prefers-color-scheme
    // media query in style.css keeps deciding -- this only ever writes an
    // explicit override when the visitor picks one.
    (function () {
      var btn = document.getElementById("theme-toggle");
      var label = document.getElementById("theme-toggle-label");
      if (!btn || !label) return;
      var order = ["system", "light", "dark", "contrast"];
      var labels = { system: "System", light: "Light", dark: "Dark", contrast: "High contrast" };

      function current() {
        try {
          var saved = localStorage.getItem("pl-theme");
          return order.indexOf(saved) > 0 ? saved : "system";
        } catch (e) {
          return "system";
        }
      }

      function render(mode) {
        label.textContent = labels[mode];
      }

      function apply(mode) {
        if (mode === "system") {
          document.documentElement.removeAttribute("data-theme");
          try { localStorage.removeItem("pl-theme"); } catch (e) {}
        } else {
          document.documentElement.setAttribute("data-theme", mode);
          try { localStorage.setItem("pl-theme", mode); } catch (e) {}
        }
        render(mode);
      }

      render(current());
      btn.addEventListener("click", function () {
        var next = order[(order.indexOf(current()) + 1) % order.length];
        apply(next);
      });
    })();
  </script>
</body>
</html>
