<div style="display:flex;justify-content:space-between;align-items:center;padding:0.4rem 0.6rem 0.3rem;">
  <strong style="font-size:0.85rem;">Notifications</strong>
  {% if notifications %}
    <form hx-post="/notifications/read-all" hx-target="#notifications-panel" hx-swap="innerHTML" style="margin:0;">
      <button type="submit" class="link-button" style="padding:0.2rem 0.4rem;font-size:0.76rem;">Mark all read</button>
    </form>
  {% endif %}
</div>
{% for n in notifications %}
  <form method="post" action="/notifications/{{ n.notification_id }}/read" style="margin:0;">
    <button type="submit" class="link-button" style="display:block;width:100%;text-align:left;padding:0.55rem 0.6rem;border-radius:8px;{{ 'font-weight:700;' if not n.read_at }}">
      <span style="color:{{ 'var(--text)' if not n.read_at else 'var(--muted)' }};">{{ n.title }}</span>
      {% if n.body %}<div class="muted" style="font-size:0.78rem;font-weight:400;margin-top:0.15rem;">{{ n.body }}</div>{% endif %}
    </button>
  </form>
{% else %}
  <p class="muted" style="padding:0.3rem 0.6rem;font-size:0.85rem;">Nothing yet.</p>
{% endfor %}
