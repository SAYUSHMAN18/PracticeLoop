<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline - PracticeLoop</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #211c16; color: #f2e9d8; font-family: -apple-system, Segoe UI, sans-serif; text-align: center; }
    div { max-width: 380px; padding: 2rem; }

    p { color: #ab9d84; }
    button { margin-top: 1rem; padding: 0.65rem 1.3rem; background: #ff7a48; color: #201005; border: none;

<body>
  <div>
    <h1>You're offline</h1>
    <p>PracticeLoop needs a connection to load this page -- your data is safe on the server and nothing here was lost. Try again once you're back online.</p>
