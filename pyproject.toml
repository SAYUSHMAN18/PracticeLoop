[project]
name = "practiceloop"
version = "0.1.0"
description = "A lean, all-Python spaced-practice platform for interview/skill prep."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "bcrypt>=4.0",
    "sentence-transformers>=3.3",
    "groq>=0.13",
    "google-generativeai>=0.8",
    "python-dotenv>=1.0",
    "pypdf>=5.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
