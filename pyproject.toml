[project]
name = "practiceloop"
version = "0.1.0"
description = "An adaptive learning platform: goal-to-path learning, spaced-repetition practice, an AI mentor, and interview/job-search prep, all on one account."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic-settings>=2.6",
    "bcrypt>=4.0",
    "sentence-transformers>=3.3",
    "python-dotenv>=1.0",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "httpx>=0.27",
    "fsrs>=6.0",
    "sympy>=1.13",  # Math Lab (Phase 12): symbolic equation solving/verification
    # The IANA time-zone database for zoneinfo. Without it, zoneinfo has no
    # data source on Windows and on slim Linux images, so every
    # ZoneInfo(name) raises and app.core.usertime silently falls back to
    # UTC -- which is exactly the timezone bug it exists to fix.
    "tzdata>=2024.1",
    # Loop Mentor and every other LLM-authored panel answers in markdown;
    # html=False makes rendering it safe without a separate sanitizer.
    "markdown-it-py>=3.0",
    # Server-side syntax highlighting for code -- fenced blocks in the
    # mentor's replies and the code_snippet on a practice question. No
    # client JS, and the colour stylesheet is generated and vendored
    # (scripts/gen_pygments_css.py) to satisfy style-src 'self'.
    "pygments>=2.18",
    # .apkg import: modern Anki (2.1.50+) exports collection.anki21b, its
    # SQLite collection zstd-compressed -- no way to read it without this,
    # and Python's stdlib doesn't gain zstd support until 3.14.
    "zstandard>=0.23",
    # Web push (app/notifications/push.py): the actual Web Push protocol
    # (message encryption + VAPID JWT signing), not just an HTTP client --
    # rolling that by hand is a real way to get it subtly wrong.
    "pywebpush>=2.0",
]

[tool.setuptools.packages.find]
# Without this, setuptools' flat-layout auto-discovery sees any top-level
# directory as a candidate package. That was silently fine while `app` was
# the only one, but scripts/ and (once the Docker build started copying it
# in for the starter-deck seed) data/ made discovery ambiguous and the
# editable install fails outright: "Multiple top-level packages discovered."
include = ["app*"]

[project.optional-dependencies]
groq = ["groq>=0.13"]
gemini = ["google-generativeai>=0.8"]
bedrock = ["boto3>=1.35"]
sentry = ["sentry-sdk>=2.19"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B008",  # Depends()/File() as default args is FastAPI's required DI pattern, not a bug
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The asyncpg pool created by app.core.db.get_pool() is bound to whatever
# event loop was active when it was created; function-scoped loops (the
# pytest-asyncio default) would tear down and recreate that loop between
# tests while the pool -- created once and cached module-globally -- kept
# referencing the now-closed one.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
