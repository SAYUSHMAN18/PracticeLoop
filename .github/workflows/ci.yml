name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-only-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip and the HuggingFace model
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          # Keyed on pyproject.toml -- the embedding model itself is pinned in
          # app/core/config.py, not here, so a dependency bump is the only
          # thing that should invalidate this cache.
          key: ${{ runner.os }}-py311-${{ hashFiles('pyproject.toml') }}

      - name: Install dependencies
        # Same CPU-only torch trick as the Dockerfile: installing it first from
        # PyTorch's own index satisfies sentence-transformers' requirement
        # without pip ever reaching for the ~2GB CUDA build.
        run: |
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,groq]"

      - name: Lint
        run: |
          ruff check app tests scripts
          ruff format --check app tests scripts

      - name: Test
        run: pytest tests/ -q
